<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT System User Management</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 24px;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

.header-logo img {
    max-width: 180px;
    height: auto;
}

.title {
    text-align: center;
    color: #A9CB38;
    font-size: 32px;
    font-weight: bold;
    margin: 10px 0 25px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
}

input, select, button {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
}


button {
    cursor: pointer;
    border: none;
    font-weight: bold;
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}

button:active {
    transform: scale(0.98);
}



.btn-primary:hover {
    background: linear-gradient(135deg, #1d4ed8, #1e40af);
}



.btn-secondary:hover {
    background: linear-gradient(135deg, #e5e7eb, #cbd5e1);
}



.btn-danger:hover {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
}









button {
    cursor: pointer;
    border: none;
    font-weight: bold;
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}

button:active {
    transform: scale(0.98);
}

.btn-primary {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #1d4ed8, #1e40af);
}

.btn-secondary {
    background: linear-gradient(135deg, #f3f4f6, #d1d5db);
    color: #111827;
}

.btn-secondary:hover {
    background: linear-gradient(135deg, #e5e7eb, #cbd5e1);
}

.btn-danger {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
}

.btn-danger:hover {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
}


.summary {
    display: flex;
    gap: 12px;
    margin: 18px 0;
    flex-wrap: wrap;
}

.card {
    background: #f9fafb;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    width: 180px;
    min-height: 90px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.card strong {
    display: block;
    font-size: 20px;
}

.toolbar {
    display: grid;
    grid-template-columns: 1fr 180px 180px;
    gap: 12px;
    margin: 18px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border-bottom: 1px solid #e5e7eb;
    padding: 10px;
    text-align: left;
}

th {
    background: #f3f4f6;
}

.actions {
    display: flex;
    gap: 6px;
}

@media (max-width: 800px) {
    .form-grid, .toolbar {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

                    <option>Wing MC</option>
                    <option>Wng Bank MC</option>
                    <option>New Wing MC</option>
                    <option>Mediatel</option>
                    <option>AML</option>
                    <option>LOS</option>
                    <option>Finance Hub</option>
                    <option>QMS System</option>
                    <option>Manage Engine</option>
                    <option>SUN and Q&A</option>
                    <option>Wing Mall</option>

            <div>
                <label>Status</label>
                <select id="status" required>
                    <option value="">Select Status</option>
                    <option>In Use</option>

<div style="margin-top:20px;">

    
<!-- Row 1 -->
<div style="
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:12px;
    margin-bottom:12px;
">
    <button class="btn-secondary" type="button" onclick="exportCSV()">
        Export CSV
    </button>

    <button class="btn-secondary" type="button"
        onclick="document.getElementById('importFile').click()">
        Import CSV
    </button>

    <button class="btn-secondary" type="button" onclick="resetForm()">
        Clear
    </button>

    <button id="saveButton" class="btn-primary" type="submit">
        Save Asset
    </button>

    <input type="file" id="importFile" accept=".csv"
        style="display:none" onchange="importCSV(event)">
</div>
</div>




    </form>

    <div class="summary">
        <div class="card">Total Assets<strong id="totalCount">0</strong></div>
        <div class="card">In Use<strong id="inUseCount">0</strong></div>
        <div class="card">In Store<strong id="inStoreCount">0</strong></div>
        <div class="card">Disposed<strong id="disposedCount">0</strong></div>
    </div>

    <div class="toolbar">
        <input id="searchInput" placeholder="Search..." oninput="renderTable()">

        <select id="systemFilter" onchange="renderTable()">
            <option value="">All Systems</option>
            <option>Flexcube</option>
            <option>TX System</option>
            <option>Wing MC</option>
            <option>Wng Bank MC</option>
            <option>New Wing MC</option>
            <option>Mediatel</option>
            <option>AML</option>
            <option>LOS</option>
            <option>Finance Hub</option>
            <option>QMS System</option>
            <option>Manage Engine</option>
            <option>SUN and Q&A</option>
            <option>Wing Mall</option>
        </select>

        <select id="statusFilter" onchange="renderTable()">
            <option value="">All Status</option>
            <option>In Use</option>
            <option>In Store</option>
            <option>Disposed</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>Asset Name</th>
                <th>System Name</th>
                <th>Status</th>
                <th>User Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="assetTable"></tbody>
    </table>

</div>

<script>

let assets = JSON.parse(localStorage.getItem("assets")) || [];

document.getElementById("assetForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const asset = {
        assetName: document.getElementById("assetName").value.trim(),
        systemName: document.getElementById("systemName").value,
        status: document.getElementById("status").value,
        userName: document.getElementById("userName").value.trim()
    };

    const editIndex = document.getElementById("editIndex").value;

    if (editIndex === "") {
        assets.push(asset);
    } else {
        const index = Number(editIndex);
        if (Number.isInteger(index) && index >= 0 && index < assets.length) {
            assets[index] = asset;
        }
    }

    saveAssets();
    renderTable();
    resetForm();
});

function saveAssets() {
    localStorage.setItem("assets", JSON.stringify(assets));
}

function resetForm() {
    document.getElementById("assetForm").reset();
    document.getElementById("editIndex").value = "";
    document.getElementById("saveButton").innerText = "Save Asset";
}

function editAsset(index) {
    const asset = assets[index];
    if (!asset) return;

    document.getElementById("assetName").value = asset.assetName;
    document.getElementById("systemName").value = asset.systemName;
    document.getElementById("status").value = asset.status;
    document.getElementById("userName").value = asset.userName;
    document.getElementById("editIndex").value = index;
    document.getElementById("saveButton").innerText = "Update Asset";
    document.getElementById("assetName").focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteAsset(index) {
    if(confirm("Delete this asset?")) {
        assets.splice(index, 1);
        saveAssets();
        renderTable();
    }
}

function importCSV(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split("\n").filter(line => line.trim() !== "");

        for(let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(",");

            if(cols.length >= 4) {
                assets.push({
                    assetName: cols[0].replace(/"/g, '').trim(),
                    systemName: cols[1].replace(/"/g, '').trim(),
                    status: cols[2].replace(/"/g, '').trim(),
                    userName: cols[3].replace(/"/g, '').trim()
                });
            }
        }

        saveAssets();
        renderTable();
        alert("Import completed.");
    };

    reader.readAsText(file);
}

function exportCSV() {
    const headers = ["Asset Name","System Name","Status","User Name"];

    const rows = assets.map(a => [
        a.assetName,
        a.systemName,
        a.status,
        a.userName
    ]);

    const csv = [headers, ...rows]
        .map(r => r.map(v => `"${v}"`).join(","))
        .join("\n");

    const blob = new Blob([csv], {type: "text/csv"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "inventory.csv";
    a.click();

    URL.revokeObjectURL(url);
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(ch) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#039;"
        }[ch];
    });
}

function renderTable() {

    const tbody = document.getElementById("assetTable");
    tbody.innerHTML = "";

    const search = document.getElementById("searchInput").value.toLowerCase();
    const systemFilter = document.getElementById("systemFilter").value;
    const statusFilter = document.getElementById("statusFilter").value;

    let filtered = assets
        .map((asset, realIndex) => ({ asset, realIndex }))
        .filter(({ asset }) => {
            return (
                (asset.assetName + asset.systemName + asset.status + asset.userName).toLowerCase().includes(search)
                && (systemFilter === "" || asset.systemName === systemFilter)
                && (statusFilter === "" || asset.status === statusFilter)
            );
        });

    filtered.forEach(({ asset, realIndex }, displayIndex) => {
        tbody.innerHTML += `
            <tr>
                <td>${displayIndex + 1}</td>
                <td>${escapeHTML(asset.assetName)}</td>
                <td>${escapeHTML(asset.systemName)}</td>
                <td>${escapeHTML(asset.status)}</td>
                <td>${escapeHTML(asset.userName)}</td>
                <td class="actions">
                    <button type="button" class="btn-secondary" onclick="editAsset(${realIndex})">Edit</button>
                    <button type="button" class="btn-danger" onclick="deleteAsset(${realIndex})">Delete</button>
                </td>
            </tr>
        `;
    });

    document.getElementById("totalCount").innerText = assets.length;
    document.getElementById("inUseCount").innerText = assets.filter(a => a.status === "In Use").length;
    document.getElementById("inStoreCount").innerText = assets.filter(a => a.status === "In Store").length;
    document.getElementById("disposedCount").innerText = assets.filter(a => a.status === "Disposed").length;
}

renderTable();

</script>

</body>
</html>
